[project]
name = "enterprise-ai-platform-api"
version = "0.1.0"
description = "Portable FastAPI backend for the enterprise AI platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.37,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
